<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Live Translator</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="top">
      <div class="brand">Live Translator <span class="pill" title="Speech and translation run on the Mac. Nothing goes to the internet.">local</span></div>
      <div class="size">
        <button id="smaller" title="Smaller text">A−</button>
        <button id="bigger" title="Bigger text">A+</button>
      </div>
    </div>

    <div class="controls">
      <div class="langs">
        <label><span>From</span><select id="src"></select></label>
        <button id="swap" class="icon" title="Swap languages">⇄</button>
        <label><span>To</span><select id="tgt"></select></label>
      </div>

      <div class="input">
        <label class="grow"><span>Audio input</span><select id="device"></select></label>
        <div class="meter" title="Input level"><div id="level"></div></div>
      </div>

      <div class="actions">
        <button id="start" class="primary">Start</button>
        <label id="fileBtn" class="btn">Audio file…<input type="file" id="file" accept="audio/*,video/*" hidden></label>
        <button id="watch" title="Read along with the session running on another device">Watch</button>
        <span class="spacer"></span>
        <button id="exportTxt" title="Download as text">TXT</button>
        <button id="exportSrt" title="Download as bilingual subtitles">SRT</button>
        <button id="clear">Clear</button>
      </div>
    </div>
    <div id="status" class="status">Connecting to the engine…</div>
    <div id="lan" class="lan" hidden></div>
  </header>

  <main id="main">
    <div class="colhead"><div id="srcHead">Original</div><div id="tgtHead">Translation</div></div>
    <div id="rows"></div>
    <div class="row live">
      <div id="liveSrc" class="src" dir="auto"></div>
      <div id="liveTgt" class="tgt muted"></div>
    </div>
    <p id="empty" class="empty">Pick the languages and the audio input, then press <b>Start</b> — or drop an audio file here.</p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
